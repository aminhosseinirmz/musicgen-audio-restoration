<text x="51" y="305" font-size="17.5" font-weight="400" text-anchor="start" letter-spacing="0" fill="#284967">Unprocessed</text>
<text x="51" y="327" font-size="17.5" font-weight="400" text-anchor="start" letter-spacing="0" fill="#284967">MusicGen clip</text>
