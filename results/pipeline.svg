<path d="M558.0 197 L558.0 237" fill="none" stroke="#7651a8" stroke-width="2.4" marker-end="url(#arrow-flashsr)"/>
<path d="M767.0 197 L767.0 237" fill="none" stroke="#a6406b" stroke-width="2.4" marker-end="url(#arrow-audiosr)"/>
<path d="M860 305 L912 305" fill="none" stroke="#08725a" stroke-width="2.4" marker-end="url(#arrow-cascade)"/>
<path d="M117.0 417 L117.0 453" fill="none" stroke="#386da5" stroke-width="2.4" marker-end="url(#arrow-raw)"/>
<path d="M319.0 417 L319.0 453" fill="none" stroke="#986313" stroke-width="2.4" marker-end="url(#arrow-dsp)"/>
<path d="M558.0 417 L558.0 453" fill="none" stroke="#7651a8" stroke-width="2.4" marker-end="url(#arrow-flashsr)"/>
<path d="M767.0 417 L767.0 453" fill="none" stroke="#a6406b" stroke-width="2.4" marker-end="url(#arrow-audiosr)"/>
