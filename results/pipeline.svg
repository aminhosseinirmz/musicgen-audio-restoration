<text x="467" y="525" font-size="21" font-weight="700" text-anchor="start" letter-spacing="-0.2" fill="#23364e">Prompt alignment</text>
<text x="467" y="549" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0" fill="#465971">CLAP similarity between each clip</text>
<text x="467" y="571" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0" fill="#465971">and its original text prompt</text>
<text x="835" y="525" font-size="21" font-weight="700" text-anchor="start" letter-spacing="-0.2" fill="#23364e">Listening quality</text>
<text x="835" y="549" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0" fill="#465971">Mean opinion score (MOS)</text>
<text x="835" y="571" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0" fill="#465971">5 listeners rated 12 clips</text>
