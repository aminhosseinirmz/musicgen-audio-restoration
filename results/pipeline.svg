<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="612" viewBox="0 0 1200 612" role="img" aria-labelledby="title description">
<title id="title">MusicGen audio restoration pipeline</title>
<desc id="description">Thirty clips were generated from five prompts in each of six categories. The original audio and a DSP baseline go directly to evaluation. FlashSR and AudioSR each take audio resampled to 48 kHz and low-pass filtered at 8 kHz. The AudioSR output is evaluated directly and also used as the input for a second stage. Before Apollo, it is prepared as 44.1 kHz mono, peak-normalized, encoded as a 96 kbps MP3 and decoded to WAV. The five mean listener scores are 1.81 for raw audio, 2.07 for DSP, 2.34 for FlashSR, 2.66 for AudioSR, and 2.93 for AudioSR followed by Apollo. Evaluation also uses spectrograms, spectral measurements and CLAP audio–text similarity. Five listeners rated versions of 12 clips.</desc>
<defs>
  <marker id="arrow-shared" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" viewBox="0 0 10 12" refX="9" refY="6" orient="auto"><path d="M0 0 L10 6 L0 12 L2.4 6 Z" fill="#60748e"/></marker>
  <marker id="arrow-raw" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" viewBox="0 0 10 12" refX="9" refY="6" orient="auto"><path d="M0 0 L10 6 L0 12 L2.4 6 Z" fill="#386da5"/></marker>
  <marker id="arrow-dsp" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" viewBox="0 0 10 12" refX="9" refY="6" orient="auto"><path d="M0 0 L10 6 L0 12 L2.4 6 Z" fill="#986313"/></marker>
  <marker id="arrow-flashsr" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" viewBox="0 0 10 12" refX="9" refY="6" orient="auto"><path d="M0 0 L10 6 L0 12 L2.4 6 Z" fill="#7651a8"/></marker>
  <marker id="arrow-audiosr" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" viewBox="0 0 10 12" refX="9" refY="6" orient="auto"><path d="M0 0 L10 6 L0 12 L2.4 6 Z" fill="#a6406b"/></marker>
  <marker id="arrow-cascade" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" viewBox="0 0 10 12" refX="9" refY="6" orient="auto"><path d="M0 0 L10 6 L0 12 L2.4 6 Z" fill="#08725a"/></marker>
  </defs>
